:block}.tag{display:inline-block;border:1px solid #356b6c;color:#a4eee2;border-radius:999px;padding:2px 9px;font-size:11px;margin-bottom:8px}.section{margin-top:18px}.notice{border-left:3px solid var(--accent);background:#102d35;padding:11px 14px;border-radius:8px}.progress{height:8px;background:#24394c;border-radius:12px;overflow:hidden}.bar{height:100%;background:var(--accent)}.hidden{display:none!important}.choice{display:block;width:100%;text-align:left;margin:8px 0}.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}label{display:block;margin:8px 0 5px}.footer{font-size:12px;color:var(--muted);padding:26px 0}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #9aeee1;outline-offset:2px}@media(max-width:620px){.shell{padding:14px}.card{padding:14px}.controls .btn{white-space:normal}.grid{grid-template-columns:minmax(0,1fr)}.split{grid-template-columns:minmax(0,1fr)}}
</style></head><body><div class="shell"><header class="top"><div><div class="eyebrow">Central Hub · Learning Repository 16</div><h1>Emotional <span style="color:var(--accent)">Intelligence</span></h1><p class="muted">Awareness · Regulation · Empathy · Relationships · Flourishing</p></div><div class="controls"><a class="btn" href="https://github.com/ObiwanDaC0-D/0-Central-Hub">Central Hub</a><a class="btn" href="https://github.com/ObiwanDaC0-D/16-Emotional-Intelligence">Repository</a></div></header><nav id="nav" class="nav" aria-label="Application sections"></nav><main id="view"></main><footer class="footer">Educational, not diagnostic or therapeutic. Notes stay in local browser storage. <button id="reset" class="btn">Clear saved data</button></footer></div><script>
const raw=[["Ability model of emotional intelligence","Models & Measurement","Perceiving, using, understanding and managing emotion are proposed interrelated abilities.","Distinguish performance-based ability from self-perceived skill.","Mayer, Salovey & Caruso (2004)","Debates remain about construct boundaries and incremental predictive validity."],["Trait emotional intelligence","Models & Measurement","Emotion-related self-perceptions are organized within personality hierarchies.","Compare self-report with actual performance and situational demands.","Petrides, Pita & Kokkinaki (2007)","Self-ratings are susceptible to impression management and overlap with personality."],["Mixed-model emotional competencies","Models & Measurement","Competency frameworks combine emotion skills with social and workplace behaviors.","Identify trainable behaviors separately from broad success claims.","Goleman (1995); Boyatzis (2009)","Broad models may overlap with personality and leadership constructs."],["Emotion differentiation","Awareness & Labeling","Granular emotion labels may help describe distinct experiences and select responses.","Compare 'bad' with frustrated, disappointed, worried or fatigued.","Barrett et al. (2001)","Associations do not prove that labeling alone causes better outcomes."],["Affect labeling","Awareness & Labeling","Putting feelings into words can change emotional processing in some settings.","Name feelings tentatively without treating a label as diagnosis.","Lieberman et al. (2007)","Laboratory findings may not generalize to every person or situation."],["Interoception","Awareness & Labeling","Perception and interpretation of bodily signals contribute to emotion experience.","Notice breathing, tension and activation without assuming a unique emotion.","Khalsa et al. (2018)","Physiological sensations are ambiguous and can reflect health or context."],["Circumplex model of affect","Awareness & Labeling","Affect can be represented along valence and activation dimensions.","Map pleasant–unpleasant and high–low activation before choosing labels.","Russell (1980)","A two-dimensional map does not capture all cultural or conceptual nuances."],["Process model of emotion regulation","Emotion Regulation","Situation selection, modification, attention, reappraisal and response modulation are distinct regulation points.","Choose a strategy based on timing and context.","Gross (1998; 2015)","No single strategy is universally adaptive."],["Cognitive reappraisal","Emotion Regulation","Changing the interpretation of a situation can change emotional responses.","Generate plausible alternative appraisals without denying evidence.","Gross & John (2003)","Reappraisal is not a mandate to suppress justified concerns."],["Expressive suppression","Emotion Regulation","Inhibiting visible expression differs from changing internal experience.","Consider interpersonal costs, safety and situational norms.","Gross & John (2003)","Effects vary by culture, setting and goals."],["Acceptance and psychological flexibility","Emotion Regulation","Allowing internal experiences while acting in line with values can support flexibility.","Notice discomfort while selecting a values-consistent action.","Hayes et al. (2006)","Acceptance is not resignation or endorsement of harmful conditions."],["Distress tolerance","Emotion Regulation","Short-term skills can support deliberate action during intense emotional arousal.","Pause, ground attention and avoid impulsive escalation.","Linehan (2015)","Skills are not substitutes for professional support when needed."],["Emotion regulation flexibility","Emotion Regulation","Effective regulation depends on context sensitivity, strategy repertoire and feedback.","Compare strategies across contexts and outcomes.","Bonanno & Burton (2013)","Flexible strategy choice is complex and difficult to quantify."],["Appraisal theory","Emotion Science","Emotion depends partly on evaluations of goals, control, novelty and significance.","Separate the event from its interpretation and perceived stakes.","Lazarus (1991); Scherer (2009)","Different appraisal models disagree on mechanisms."],["Constructionist theory of emotion","Emotion Science","Emotional experiences emerge from interacting bodily, conceptual and situational processes.","Consider learned categories, prediction and context.","Barrett (2017)","Theories of emotion construction are actively debated."],["Basic emotion approaches","Emotion Science","Some models propose evolutionarily shaped emotion systems and expressions.","Compare proposed universals with contextual variability.","Ekman (1992)","Strong universal-expression claims face substantial critique."],["Broaden-and-build theory","Emotion Science","Positive emotions may broaden attention and support resource-building over time.","Explore curiosity and connection without demanding constant positivity.","Fredrickson (2001)","Specific mechanisms and effect sizes vary across studies."],["Emotional contagion","Social & Relational","Emotion-related expressions and interaction patterns can influence others.","Track reciprocal dynamics rather than blaming one person's mood.","Hatfield, Cacioppo & Rapson (1994)","Similarity does not establish direct emotional transmission."],["Empathic accuracy","Social & Relational","People can sometimes infer others' feelings more accurately with context and feedback.","Check interpretations through respectful questions.","Ickes (1993)","Accuracy varies; confidence is not evidence of mind-reading."],["Cognitive and affective empathy","Social & Relational","Understanding perspectives and sharing emotional responses are related but distinct.","Practice perspective-taking without assuming identical experience.","Decety & Jackson (2004)","Empathy is not always beneficial without boundaries and regulation."],["Compassion","Social & Relational","Concern for suffering can motivate supportive action without requiring emotional merging.","Ask what support would be useful and consented to.","Goetz, Keltner & Simon-Thomas (2010)","Compassion can be constrained by resources, context and bias."],["Active listening","Social & Relational","Attending, reflecting and clarifying can support mutual understanding.","Paraphrase and ask whether your understanding is accurate.","Rogers & Farson (1957)","Reflective statements can feel mechanical when insincere."],["Nonviolent communication","Social & Relational","A structured approach separates observation, feelings, needs and requests.","Practice non-accusatory requests while acknowledging disagreement.","Rosenberg (2003)","Popular framework; evidence is more limited than for some established therapies."],["Attachment and emotion regulation","Development & Identity","Relational histories can influence expectations and regulation patterns.","Consider attachment ideas as hypotheses, not personality labels.","Mikulincer & Shaver (2007)","Attachment patterns are not immutable diagnoses."],["Emotion socialization","Development & Identity","Family and social contexts shape emotion language and response habits.","Examine modeled responses and cultural norms.","Eisenberg, Cumberland & Spinrad (1998)","Development is shaped by many interacting influences."],["Emotional labor","Society & Power","Institutions can require workers to manage displayed feelings as part of paid roles.","Analyze surface acting, deep acting and organizational power.","Hochschild (1983)","Emotional labor is not reducible to individual coping deficits."],["Feeling rules","Society & Power","Social groups prescribe what people should feel and display.","Identify expectations across family, workplace and institutions.","Hochschild (1979)","Rules differ across cultures, identities and power relations."],["Dramaturgy and impression management","Society & Power","Social performances change with audience, setting and role.","Compare front-stage displays and private experience.","Goffman (1959)","Performance does not automatically imply deception."],["Emotion work","Society & Power","People actively shape feelings in everyday social relationships.","Identify who is expected to manage whose comfort.","Hochschild (1979)","Unequal expectations can reflect structural conditions."],["Psychological safety","Workplace & Leadership","Teams may learn more effectively when interpersonal risk-taking feels safe.","Invite questions, dissent and repair after mistakes.","Edmondson (1999)","Psychological safety does not mean absence of accountability."],["Conflict de-escalation","Workplace & Leadership","Validation, clarification and boundaries can reduce escalation risk.","Slow the exchange, name needs and seek workable next steps.","Deutsch, Coleman & Marcus (2014)","Not all conflicts can or should be resolved through accommodation."],["Emotion and decision-making","Judgment & Learning","Emotions can shape attention, risk judgments and choice.","Distinguish useful signals from overgeneralized predictions.","Lerner et al. (2015)","Emotions are neither universally irrational nor universally informative."],["Somatic marker hypothesis","Judgment & Learning","Body-linked affective signals may contribute to decision processes.","Examine bodily reactions alongside external evidence.","Damasio (1994)","Neural mechanisms and interpretations remain debated."],["Metacognitive monitoring","Judgment & Learning","Monitoring confidence and uncertainty can improve learning and judgment.","Rate confidence, seek feedback and revise explanations.","Nelson & Narens (1990)","Confidence can be poorly calibrated without feedback."],["Self-compassion","Wellbeing & Flourishing","A kind, mindful stance toward personal difficulty may support coping.","Respond to mistakes with accountability and constructive care.","Neff (2003)","Not a replacement for structural change or clinical care."],["Self-determination theory","Wellbeing & Flourishing","Autonomy, competence and relatedness are proposed basic psychological needs.","Choose actions that support agency, growth and connection.","Ryan & Deci (2000)","Need satisfaction depends on context and institutional conditions."],["Values-based action","Wellbeing & Flourishing","Chosen values can guide behavior even when emotions fluctuate.","Translate a value into a small observable action.","Hayes et al. (2006)","Values are personally and culturally situated."],["Mindfulness","Wellbeing & Flourishing","Attention to present experience can support awareness and regulation.","Observe sensations and thoughts without immediately reacting.","Kabat-Zinn (1990)","Effects vary; practice is not universally comfortable or sufficient."]],scenarios=[{"title":"The tense project review","setting":"A teammate critiques your work in front of colleagues. You notice heat in your face and an urge to interrupt.","choices":[["Pause, clarify and request specifics","You allow the reaction, ask which part needs revision, and agree on a concrete next step.",2],["Counterattack immediately","You shift the discussion toward the other person's mistakes.",0],["Say nothing and ruminate","You avoid the moment but leave the misunderstanding unresolved.",1]],"lenses":[7,8,25,29,30]},{"title":"The child who is overwhelmed","setting":"A young child is crying because a planned activity has changed unexpectedly.","choices":[["Name the change and offer choices","You acknowledge the disappointment and provide two manageable options.",2],["Demand immediate calm","You tell the child to stop crying before discussing anything.",0],["Remove every boundary","You promise that no plans will ever change again.",1]],"lenses":[3,20,24,10,11]},{"title":"The unanswered message","setting":"Someone important has not replied to your message for several hours. You start imagining negative explanations.","choices":[["Generate alternatives and wait","You distinguish the lack of reply from your interpretation and choose a reasonable follow-up time.",2],["Send repeated accusations","You assume rejection and demand an explanation.",0],["Pretend it does not matter","You suppress your concern without deciding how to address it.",1]],"lenses":[8,13,18,23,33]},{"title":"The disagreement at home","setting":"A routine household decision becomes heated. Both people are talking faster and interrupting.","choices":[["Reflect, state a need, propose a pause","You summarize the concern, explain your need and offer to revisit the issue shortly.",2],["Prove who is right","You raise your voice and focus on winning.",0],["Agree to anything to end conflict","You concede without addressing your own needs.",1]],"lenses":[19,21,22,30,36]},{"title":"The emotionally demanding role","setting":"At work, you must remain composed while hearing a frustrated stakeholder describe a serious concern.","choices":[["Acknowledge and set realistic expectations","You listen, clarify what you can do and preserve appropriate boundaries.",2],["Perform enthusiasm you do not feel","You promise an outcome outside your authority.",0],["Dismiss the frustration","You describe the person's emotion as unreasonable.",0]],"lenses":[25,26,28,29,30]}];
const theories=raw.map((r,id)=>({id,name:r[0],domain:r[1],claim:r[2],practice:r[3],source:r[4],caution:r[5]})),domains=[...new Set(theories.map(t=>t.domain))],sections=['Explore','Theory Library','Concept Map','Emotion Atlas','EI Simulator','Learning Journey','Regulation Lab','Regulation Compare','Empathy Studio','Social Scenarios','Compare','Recall Lab','Study Path','Journal'];
const store={get(k,d){try{return JSON.parse(localStorage.getItem('ei-'+k))??d}catch{return d}},set(k,v){try{localStorage.setItem('ei-'+k,JSON.stringify(v))}catch{}}},el=id=>document.getElementById(id),safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
let active='Explore',filter='All',query='',selected=0,studied=store.get('studied',[]),bookmarks=store.get('bookmarks',[]),journal=store.get('journal',{}),reviews=store.get('reviews',{}),emotionLog=store.get('emotionLog',[]),regulationLog=store.get('regulationLog',[]),empathyLog=store.get('empathyLog',[]),scenarioLog=store.get('scenarioLog',[]),compareA=0,compareB=1,scenarioIndex=0,recallIndex=null,recallMode='Due';
function btn(label,fn,cls='btn'){let b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b}
function download(name,obj){let u=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})),a=document.createElement('a');a.download=name;a.href=u;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function navigate(s){active=s;render();document.querySelector('.tab.active')?.scrollIntoView({behavior:'smooth',inline:'nearest',block:'nearest'});window.scrollTo({top:0,behavior:'smooth'})}
function render(){let n=el('nav');n.innerHTML='';sections.forEach(s=>n.append(btn(s,()=>navigate(s),'tab '+(active===s?'active':''))));let v=el('view');v.innerHTML='';({Explore:explore,'Theory Library':library,'Concept Map':map,'Emotion Atlas':atlas,'EI Simulator':eiSimulator,'Learning Journey':journeyView,'Regulation Lab':regulation,'Regulation Compare':regulationCompare,'Empathy Studio':empathy,'Social Scenarios':social,Compare:compare,'Recall Lab':recall,'Study Path':study,Journal:journalView})[active](v)}
function explore(v){v.innerHTML='<div class="card"><span class="tag">Evidence-aware emotional learning</span><h2>Notice emotions. Understand context. Choose skillful action.</h2><p>Explore emotional intelligence models alongside emotion science, regulation, social relationships, identity, institutional feeling rules and wellbeing. Practice with reflection tools rather than treating emotional intelligence as a fixed score.</p><div class="notice"><strong>Core principle:</strong> Emotional skill involves awareness, flexibility, consent, context and respect for differences. No single strategy works in every situation.</div><div id="quick" class="controls"></div></div><div class="stats"><div class="card stat"><strong>'+theories.length+'</strong><span class="muted">Frameworks</span></div><div class="card stat"><strong>'+domains.length+'</strong><span class="muted">Domains</span></div><div class="card stat"><strong>'+studied.length+'</strong><span class="muted">Studied</span></div><div class="card stat"><strong>'+emotionLog.length+'</strong><span class="muted">Emotion observations</span></div></div><div class="card"><h3>Learning progress</h3><div class="progress"><div class="bar" style="width:'+(100*studied.length/theories.length)+'%"></div></div><p class="muted small">'+studied.length+' of '+theories.length+' studied</p></div><h2 class="section">Explore by domain</h2><div class="grid" id="domains"></div>';[['Study theories','Theory Library'],['Map an emotion','Emotion Atlas'],['Explore regulation','Regulation Lab'],['Practice empathy','Empathy Studio']].forEach(([label,section])=>el('quick').append(btn(label,()=>navigate(section),'btn primary')));domains.forEach(d=>{let c=document.createElement('article');c.className='card';c.innerHTML='<span class="tag">'+theories.filter(t=>t.domain===d).length+' frameworks</span><h3>'+safe(d)+'</h3>';c.append(btn('Explore',()=>{filter=d;query='';navigate('Theory Library')}));el('domains').append(c)})}
function library(v){v.innerHTML='<h2>Theory & Research Library</h2><p class="muted">Foundational reading leads are not an independently verified systematic review.</p><div class="controls"><input class="field" id="search" placeholder="Search frameworks, researchers, domains…"><select class="field" id="filter"></select></div><div class="grid" id="cards"></div><div class="card section" id="detail"></div>';el('search').value=query;el('search').oninput=e=>{query=e.target.value;listCards()};el('filter').innerHTML=['All',...domains].map(x=>'<option>'+safe(x)+'</option>').join('');el('filter').value=filter;el('filter').onchange=e=>{filter=e.target.value;listCards()};listCards();detail()}
function listCards(){let q=query.toLowerCase(),items=theories.filter(t=>(filter==='All'||t.domain===filter)&&[t.name,t.claim,t.source,t.domain].join(' ').toLowerCase().includes(q));el('cards').innerHTML='';items.forEach(t=>{let c=document.createElement('article');c.className='card';c.innerHTML='<span class="tag">'+safe(t.domain)+'</span><h3>'+safe(t.name)+'</h3><p>'+safe(t.claim)+'</p>';c.append(btn('Study framework',()=>{selected=t.id;detail();el('detail').scrollIntoView({behavior:'smooth'})}));el('cards').append(c)});if(!items.length)el('cards').innerHTML='<p class="muted">No matching frameworks.</p>'}
function detail(){let t=theories[selected];el('detail').innerHTML='<span class="tag">'+safe(t.domain)+'</span><h2>'+safe(t.name)+'</h2><h3>Central idea</h3><p>'+safe(t.claim)+'</p><h3>Practice</h3><p>'+safe(t.practice)+'</p><h3>Interpretive limitation</h3><p>'+safe(t.caution)+'</p><h3>Reading lead</h3><p>'+safe(t.source)+'</p><div id="detailActions" class="controls"></div>';el('detailActions').append(btn(studied.includes(t.id)?'✓ Studied — undo':'Mark studied',()=>{studied=studied.includes(t.id)?studied.filter(x=>x!==t.id):[...studied,t.id];store.set('studied',studied);detail()}),btn(bookmarks.includes(t.id)?'★ Bookmarked':'☆ Bookmark',()=>{bookmarks=bookmarks.includes(t.id)?bookmarks.filter(x=>x!==t.id):[...bookmarks,t.id];store.set('bookmarks',bookmarks);detail()}),btn('Compare',()=>{compareA=t.id;navigate('Compare')}))}
function map(v){v.innerHTML='<h2>Concept Map</h2><p class="muted">A domain-organized map of conceptual relationships, not a causal model.</p><div class="controls"><select class="field" id="mapFilter"></select></div><div class="grid" id="mapCards"></div>';el('mapFilter').innerHTML=['All',...domains].map(d=>'<option>'+safe(d)+'</option>').join('');el('mapFilter').onchange=drawMap;drawMap()}
function drawMap(){let domain=el('mapFilter').value;el('mapCards').innerHTML='';theories.filter(t=>domain==='All'||t.domain===domain).forEach(t=>{let c=document.createElement('div');c.className='card';c.innerHTML='<span class="tag">'+safe(t.domain)+'</span><h3>'+safe(t.name)+'</h3>';c.append(btn('Explore connection',()=>{selected=t.id;filter='All';navigate('Theory Library')}));el('mapCards').append(c)})}
const emotionNames=['Joy','Interest','Gratitude','Calm','Hope','Pride','Sadness','Disappointment','Anger','Frustration','Fear','Anxiety','Shame','Guilt','Loneliness','Overwhelm','Mixed or uncertain'];
function atlas(v){v.innerHTML='<h2>Emotion Atlas</h2><p class="muted">Map a subjective experience across emotion label, valence, activation, body sensations and context. This is not a diagnosis.</p><div class="split"><div class="card"><label for="emotionName">Emotion label</label><select id="emotionName" class="field"></select><label for="valence">Pleasantness <span id="valenceValue"></span></label><input type="range" id="valence" min="-5" max="5" value="0" style="width:100%"><label for="arousal">Activation <span id="arousalValue"></span></label><input type="range" id="arousal" min="0" max="10" value="5" style="width:100%"><label for="emotionContext">Situation or trigger</label><textarea class="field" id="emotionContext"></textarea><label for="emotionBody">Body sensations / uncertainty</label><textarea class="field" id="emotionBody"></textarea><div class="controls"><button class="btn primary" id="emotionSave">Save observation</button><button class="btn" id="emotionExport">Export log</button></div></div><div class="card"><h3>Affect space</h3><svg viewBox="0 0 400 400" style="width:100%;height:auto" role="img" aria-label="Valence and activation axes"><rect x="40" y="30" width="330" height="330" rx="12" fill="#102338"/><path d="M205 30 V360 M40 195 H370" stroke="#456477" stroke-width="2"/><text x="205" y="20" text-anchor="middle" fill="#c4d7e7" font-size="13">High activation</text><text x="205" y="387" text-anchor="middle" fill="#c4d7e7" font-size="13">Low activation</text><text x="43" y="185" fill="#c4d7e7" font-size="12">Unpleasant</text><text x="303" y="185" fill="#c4d7e7" font-size="12">Pleasant</text><circle id="emotionDot" cx="205" cy="195" r="10" fill="#69d9c5" stroke="#fff" stroke-width="2"/></svg><p class="muted small">A simplified circumplex representation; real emotions are richer than two axes.</p></div></div><h3 class="section">Saved observations</h3><div id="emotionHistory" class="grid"></div>';el('emotionName').innerHTML=emotionNames.map(x=>'<option>'+safe(x)+'</option>').join('');let update=()=>{let val=+el('valence').value,ar=+el('arousal').value;el('valenceValue').textContent=val;el('arousalValue').textContent=ar;el('emotionDot').setAttribute('cx',205+val*33);el('emotionDot').setAttribute('cy',360-ar*33)};el('valence').oninput=update;el('arousal').oninput=update;update();el('emotionSave').onclick=()=>{emotionLog.unshift({date:new Date().toISOString(),emotion:el('emotionName').value,valence:+el('valence').value,activation:+el('arousal').value,context:el('emotionContext').value,body:el('emotionBody').value});store.set('emotionLog',emotionLog);renderEmotionHistory()};el('emotionExport').onclick=()=>download('emotional-intelligence-emotion-log.json',emotionLog);renderEmotionHistory()}
function renderEmotionHistory(){let host=el('emotionHistory');host.innerHTML='';emotionLog.forEach((x,i)=>{let c=document.createElement('div');c.className='card';c.innerHTML='<span class="tag">'+safe(x.emotion)+'</span><p>Valence '+x.valence+' · activation '+x.activation+'</p><p>'+safe(x.context)+'</p><p class="muted">'+safe(x.body)+'</p><p class="small muted">'+safe(x.date.slice(0,10))+'</p>';c.append(btn('Delete',()=>{if(confirm('Delete this entry?')){emotionLog.splice(i,1);store.set('emotionLog',emotionLog);renderEmotionHistory()}}));host.append(c)});if(!emotionLog.length)host.innerHTML='<p class="muted">No observations yet.</p>'}
const strategies=[['Situation selection','Choose whether, when or how to enter a situation.','Consider avoiding unnecessary exposure without abandoning important values.'],['Situation modification','Change an aspect of the environment or interaction.','Make a specific request or adjust conditions.'],['Attention deployment','Redirect or broaden attention intentionally.','Notice what you are focusing on and whether it serves your goal.'],['Cognitive reappraisal','Consider a plausible alternative interpretation.','Generate alternatives without denying facts or legitimate harm.'],['Response modulation','Modify the behavioral or physiological response.','Slow speech, take a break or ground attention.'],['Acceptance','Make room for emotion while choosing values-consistent behavior.','Allow discomfort without requiring it to disappear.'],['Social support','Seek appropriate clarification, comfort or assistance.','Ask whether another person has capacity to help.']];

const eiTriggers=['Critical feedback','Unexpected schedule change','Unanswered message','Interpersonal disagreement','Successful collaboration','Uncertain future outcome'];
const eiAppraisals=['Threat or rejection','Challenge with options','Ambiguous; more information needed','Opportunity for connection'];
const eiResponses=['React immediately','Pause and ask a question','Withdraw temporarily','Express a clear request','Seek support'];
let eiSimulation=store.get('eiSimulation',{trigger:0,activation:6,appraisal:0,strategy:0,response:0}),eiExperiments=store.get('eiExperiments',[]),eiSimNotes=store.get('eiSimNotes','');

let eiJourney=store.get('eiJourney',null),eiJourneyHistory=store.get('eiJourneyHistory',[]);
function journeyCapture(){eiJourney={id:eiJourney?.id||new Date().toISOString(),created:eiJourney?.created||new Date().toISOString(),trigger:eiSimulation.trigger,activation:eiSimulation.activation,appraisal:eiSimulation.appraisal,strategy:eiSimulation.strategy,response:eiSimulation.response,notes:el('eiNotes')?.value||eiSimNotes,situation:eiJourney?.situation||eiTriggers[eiSimulation.trigger],goal:eiJourney?.goal||'',plan:eiJourney?.plan||'',alternative:eiJourney?.alternative??((eiSimulation.strategy+1)%strategies.length),reflection:eiJourney?.reflection||''};store.set('eiJourney',eiJourney)}

function due(i){return !reviews[i]||reviews[i].due<=Date.now()}
function recall(v){let count=recallPrompts.filter((_,i)=>due(i)).length;v.innerHTML='<h2>Recall Lab</h2><p class="muted">Try retrieval before revealing an answer. Review intervals are heuristic rather than a validated memory model.</p><div class="controls"><button class="btn" id="due">Due ('+count+')</button><button class="btn" id="all">All ('+recallPrompts.length+')</button><button class="btn" id="recallExport">Export reviews</button></div><div id="recallCard" class="card"></div>';el('due').onclick=()=>{recallMode='Due';recallIndex=null;recall(v)};el('all').onclick=()=>{recallMode='All';recallIndex=null;recall(v)};el('recallExport').onclick=()=>download('ei-recall.json',reviews);drawRecall()}
function drawRecall(){let pool=recallPrompts.map((_,i)=>i).filter(i=>recallMode==='All'||due(i));if(!pool.length){el('recallCard').innerHTML='<h3>All caught up</h3><p>No prompts due now.</p>';return}if(recallIndex===null||!pool.includes(recallIndex))recallIndex=pool[0];let i=recallIndex,t=theories[recallPrompts[i][1]];el('recallCard').innerHTML='<span class="tag">'+safe(t.domain)+'</span><h3>'+safe(recallPrompts[i][0])+'</h3><textarea class="field" placeholder="Answer from memory…"></textarea><div class="controls"><button class="btn primary" id="reveal">Reveal</button><button class="btn" id="skip">Skip</button></div><div class="hidden" id="answer"><p>'+safe(t.claim)+' '+safe(t.caution)+'</p><div class="controls" id="grades"></div></div>';el('reveal').onclick=()=>{el('answer').classList.remove('hidden');el('reveal').disabled=true;[['Again',0],['Hard',1],['Good',3],['Easy',7]].forEach(([label,days])=>el('grades').append(btn(label,()=>{reviews[i]={due:Date.now()+days*86400000,count:(reviews[i]?.count||0)+1};store.set('reviews',reviews);recallIndex=null;recall(el('view'))})))};el('skip').onclick=()=>{recallIndex=pool[(pool.indexOf(i)+1)%pool.length];drawRecall()}}
const phases=[['1 · Emotional awareness',[0,1,3,4,5,6]],['2 · Emotion science',[13,14,15,16,31,32]],['3 · Regulation & flexibility',[7,8,9,10,11,12]],['4 · Empathy & relationships',[17,18,19,20,21,22,23,24]],['5 · Society, work & flourishing',[25,26,27,28,29,30,33,34,35,36,37]]];
function study(v){v.innerHTML='<h2>Guided Study Path</h2><p class="muted">Five phases connect theory to practical reflection.</p><div id="phaseCards" class="grid"></div>';phases.forEach(([name,ids])=>{let c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+safe(name)+'</h3><p class="muted small">'+ids.filter(id=>studied.includes(id)).length+' / '+ids.length+' studied</p>';ids.forEach(id=>c.append(btn((studied.includes(id)?'✓ ':'○ ')+theories[id].name,()=>{selected=id;filter='All';query='';navigate('Theory Library');el('detail').scrollIntoView({behavior:'smooth'})},'btn choice')));el('phaseCards').append(c)})}
const prompts=['What emotion did I notice, and what might it be telling me?','What alternative appraisal could fit the facts?','How did I balance acceptance with deliberate action?','Where did I mistake an assumption about another person for a fact?','What feeling rules or power dynamics influenced the situation?','What values-consistent action would support my relationships and wellbeing?'];
function journalView(v){v.innerHTML='<h2>Reflection Journal</h2><p class="muted">Reflections are saved only in this browser. Avoid recording identifiable information about others without consent.</p><div class="grid" id="journalCards"></div><div class="controls"><button class="btn" id="journalExport">Export journal</button></div>';prompts.forEach((p,i)=>{let c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+safe(p)+'</h3><textarea class="field" id="note-'+i+'"></textarea><button class="btn" id="save-'+i+'">Save reflection</button>';el('journalCards').append(c);el('note-'+i).value=journal[i]||'';el('save-'+i).onclick=()=>{journal[i]=el('note-'+i).value;store.set('journal',journal);el('save-'+i).textContent='Saved ✓'}});el('journalExport').onclick=()=>download('emotional-intelligence-journal.json',journal)}
el('reset').onclick=()=>{if(!confirm('Delete all locally saved learning data?'))return;['studied','bookmarks','journal','reviews','emotionLog','regulationLog','empathyLog','scenarioLog','eiSimulation','eiExperiments','eiSimNotes','regCompareState','regRepertoire','regCompareNotes','eiJourney','eiJourneyHistory'].forEach(k=>localStorage.removeItem('ei-'+k));studied=[];bookmarks=[];journal={};reviews={};emotionLog=[];regulationLog=[];empathyLog=[];scenarioLog=[];eiSimulation={trigger:0,activation:6,appraisal:0,strategy:0,response:0};eiExperiments=[];eiSimNotes='';regCompareState={context:0,situation:'',goal:'',a:3,b:5};regRepertoire=[];regCompareNotes='';eiJourney=null;eiJourneyHistory=[];render()};render();
</script></body></html>
